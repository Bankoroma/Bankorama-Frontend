services:
  frontend:
    build:
      context: .
      args:
        # URL appelée par le navigateur : doit pointer vers le port publié de l'API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: bankorama_frontend
    restart: always
    ports:
      - "3000:3000"
